<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人脸识别系统 — 登录</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--purple:#6C3FF5;--dark:#2D2D2D;--orange:#FF9B6B;--yellow:#E8D754;--bg:#0a0a0f;--card:#fff;--border:#e2e8f0;--text:#1a1a2e;--muted:#64748b;--danger:#ef4444}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}

.left-panel{position:relative;overflow:hidden;background:#0a0a0f;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px;user-select:none}
.grid-bg{position:absolute;inset:0;opacity:.05;background-image:linear-gradient(rgba(255,255,255,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.15) 1px,transparent 1px);background-size:20px 20px}
.blur-c1{position:absolute;top:25%;right:25%;width:256px;height:256px;background:rgba(255,255,255,.1);border-radius:50%;filter:blur(96px)}
.blur-c2{position:absolute;bottom:25%;left:25%;width:384px;height:384px;background:rgba(255,255,255,.05);border-radius:50%;filter:blur(96px)}
.top-row{z-index:20;display:flex;align-items:center;justify-content:flex-end}
.lang-switch{z-index:20;display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:8px;padding:3px}
.lang-btn{padding:5px 10px;border:none;background:none;color:rgba(255,255,255,.5);font-size:.75rem;font-weight:500;cursor:pointer;border-radius:6px;transition:all .2s;font-family:inherit}
.lang-btn:hover{color:rgba(255,255,255,.8)}
.lang-btn.active{background:rgba(108,63,245,.5);color:#fff}
.chars-area{position:relative;z-index:20;flex:1;display:flex;align-items:flex-end;justify-content:center;margin:20px 0}

.char-base{position:absolute;bottom:0;transition:transform .7s ease-in-out}
.char-eyes{position:absolute;display:flex;align-items:center;transition:all .7s ease-in-out}
.eye{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:height .15s;overflow:hidden}
.eye.blink{height:2px!important}

.bottom-links{z-index:20;display:flex;gap:32px;font-size:.82rem;opacity:.45}
.bottom-links a{color:#fff;text-decoration:none;transition:opacity .2s}
.bottom-links a:hover{opacity:1}

.right-panel{display:flex;align-items:center;justify-content:center;padding:48px;background:#fff}
.form-card{width:100%;max-width:420px}
.form-header{text-align:center;margin-bottom:40px}
.form-header h1{font-size:1.8rem;font-weight:700;color:var(--text);margin-bottom:6px}
.form-header p{font-size:.88rem;color:var(--muted)}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.82rem;font-weight:500;color:var(--text);margin-bottom:6px}
.form-group input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;font-size:.92rem;font-family:inherit;color:var(--text);background:var(--card);outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,63,245,.1)}
.form-group input::placeholder{color:#94a3b8}
.pw-wrapper{position:relative}
.pw-wrapper input{padding-right:48px}
.eye-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center;transition:color .2s}
.eye-toggle:hover{color:var(--text)}
.extra-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:.82rem}
.remember-me{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer}
.remember-me input{accent-color:var(--purple);cursor:pointer}
.forgot-link{color:var(--purple);text-decoration:none;font-weight:500;white-space:nowrap}
.forgot-link:hover{text-decoration:underline}
.btn-login{width:100%;padding:13px;background:var(--purple);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background .2s,transform .1s}
.btn-login:hover{background:#5a32e0}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{opacity:.6;cursor:not-allowed}
.btn-login .spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
.btn-login.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-google{width:100%;padding:12px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);font-size:.92rem;font-weight:500;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text);margin-top:16px;transition:background .2s,border-color .2s}
.btn-google:hover{background:#f1f5f9;border-color:#cbd5e1}
.register-link{text-align:center;margin-top:24px;font-size:.84rem;color:var(--muted)}
.register-link a{color:var(--text);text-decoration:none;font-weight:600}
.register-link a:hover{text-decoration:underline}
.error-msg{display:none;color:var(--danger);font-size:.8rem;padding:10px 14px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin-bottom:16px;text-align:center}
.error-msg.show{display:block}
.shake{animation:shake .4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes charBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}60%{transform:translateY(-4px)}}

@media(max-width:860px){.split{grid-template-columns:1fr}.left-panel{display:none}}
</style>
</head>
<body>

<div class="split">

<!-- ====== 左侧面板 ====== -->
<div class="left-panel">
<div class="grid-bg"></div>
<div class="blur-c1"></div>
<div class="blur-c2"></div>

<div class="top-row">
<div class="lang-switch" id="langSwitch">
<button class="lang-btn active" data-lang="zh">中</button>
<button class="lang-btn" data-lang="en">EN</button>
<button class="lang-btn" data-lang="fr">FR</button>
<button class="lang-btn" data-lang="ru">RU</button>
<button class="lang-btn" data-lang="es">ES</button>
</div>
</div>

<div class="chars-area">
<div style="position:relative;width:550px;height:400px">

<!-- Purple 紫色矩形 - 后层 -->
<div class="char-base" id="charPurple" style="left:70px;width:180px;height:400px;background:#6C3FF5;border-radius:10px 10px 0 0;z-index:1;transform-origin:bottom center">
<div class="char-eyes" id="purpleEyes" style="gap:32px;left:45px;top:40px">
<div class="eye" id="purpleEyeL" style="width:18px;height:18px;background:#fff"><div style="width:7px;height:7px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="purplePL"></div></div>
<div class="eye" id="purpleEyeR" style="width:18px;height:18px;background:#fff"><div style="width:7px;height:7px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="purplePR"></div></div>
</div>
</div>

<!-- Black 黑色矩形 - 中层 -->
<div class="char-base" id="charBlack" style="left:240px;width:120px;height:310px;background:#2D2D2D;border-radius:8px 8px 0 0;z-index:2;transform-origin:bottom center">
<div class="char-eyes" id="blackEyes" style="gap:24px;left:26px;top:32px">
<div class="eye" id="blackEyeL" style="width:16px;height:16px;background:#fff"><div style="width:6px;height:6px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="blackPL"></div></div>
<div class="eye" id="blackEyeR" style="width:16px;height:16px;background:#fff"><div style="width:6px;height:6px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="blackPR"></div></div>
</div>
</div>

<!-- Orange 橙色半圆 - 前左层 -->
<div class="char-base" id="charOrange" style="left:0;width:240px;height:200px;z-index:3;background:#FF9B6B;border-radius:120px 120px 0 0;transform-origin:bottom center">
<div class="char-eyes" id="orangeEyes" style="gap:32px;left:82px;top:90px;transition:all .2s ease-out">
<div class="eye" id="orangeEyeL" style="width:14px;height:14px;background:transparent"><div style="width:12px;height:12px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="orangePL"></div></div>
<div class="eye" id="orangeEyeR" style="width:14px;height:14px;background:transparent"><div style="width:12px;height:12px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="orangePR"></div></div>
</div>
</div>

<!-- Yellow 黄色圆角矩形 - 前右层 -->
<div class="char-base" id="charYellow" style="left:310px;width:140px;height:230px;background:#E8D754;border-radius:70px 70px 0 0;z-index:4;transform-origin:bottom center">
<div class="char-eyes" id="yellowEyes" style="gap:24px;left:52px;top:40px;transition:all .2s ease-out">
<div class="eye" id="yellowEyeL" style="width:14px;height:14px;background:transparent"><div style="width:12px;height:12px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="yellowPL"></div></div>
<div class="eye" id="yellowEyeR" style="width:14px;height:14px;background:transparent"><div style="width:12px;height:12px;border-radius:50%;background:#2D2D2D;transition:transform .1s ease-out" id="yellowPR"></div></div>
</div>
<div style="position:absolute;width:80px;height:4px;background:#2D2D2D;border-radius:2px;transition:all .2s ease-out" id="yellowMouth" class="ymouth-base" data-left="40" data-top="88"></div>
</div>

</div>
</div>

<div class="bottom-links" id="bottomLinks">
<a href="#">隐私政策</a>
<a href="#">服务条款</a>
<a href="#">联系我们</a>
</div>
</div>

<!-- ====== 右侧表单 ====== -->
<div class="right-panel">
<div class="form-card" id="formCard">
<div class="form-header">
<h1 id="formTitle">欢迎回来！</h1>
<p id="formSubtitle">请输入您的账户信息</p>
</div>

<form id="loginForm">
<div class="form-group">
<label id="labelUsername">用户名</label>
<input type="text" id="username" placeholder="请输入用户名" autocomplete="username" autofocus>
</div>
<div class="form-group">
<label id="labelPassword">密码</label>
<div class="pw-wrapper">
<input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
<button type="button" class="eye-toggle" id="eyeToggle" title="显示密码">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
</button>
</div>
</div>

<div class="error-msg" id="loginError"></div>

<div class="extra-row">
<label class="remember-me"><input type="checkbox" id="rememberMe"> <span id="rememberText">记住30天</span></label>
<a href="#" class="forgot-link" id="forgotLink" onclick="return false">忘记密码？</a>
</div>

<button type="submit" class="btn-login" id="loginBtn">
<span class="spinner"></span><span id="loginBtnText">登 录</span>
</button>

<button type="button" class="btn-google" id="googleBtn" onclick="return false">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
<span id="googleBtnText">使用 Google 登录</span>
</button>
</form>

<p class="register-link"><span id="noAccountText">还没有账户？</span> <a href="#" id="signUpLink">立即注册</a></p>
</div>
</div>

</div>

<script>
(function(){
var i18n={zh:{title:'欢迎回来！',subtitle:'请输入您的账户信息',usernameLabel:'用户名',usernamePlaceholder:'请输入用户名',passwordLabel:'密码',passwordPlaceholder:'••••••••',showPw:'显示密码',hidePw:'隐藏密码',remember:'记住30天',forgot:'忘记密码？',loginBtn:'登 录',googleBtn:'使用 Google 登录',noAccount:'还没有账户？',signUp:'立即注册',bottomPrivacy:'隐私政策',bottomTerms:'服务条款',bottomContact:'联系我们',errorEmpty:'请输入用户名和密码',errorGeneric:'用户名或密码错误，请重试',errorNetwork:'网络错误，请检查连接',loggingIn:'登录中...'},en:{title:'Welcome back!',subtitle:'Please enter your details',usernameLabel:'Username',usernamePlaceholder:'Enter your username',passwordLabel:'Password',passwordPlaceholder:'••••••••',showPw:'Show password',hidePw:'Hide password',remember:'Remember for 30 days',forgot:'Forgot password?',loginBtn:'Log in',googleBtn:'Log in with Google',noAccount:"Don't have an account?",signUp:'Sign Up',bottomPrivacy:'Privacy Policy',bottomTerms:'Terms of Service',bottomContact:'Contact',errorEmpty:'Please enter your username and password',errorGeneric:'Invalid username or password. Please try again.',errorNetwork:'Network error, please try again',loggingIn:'Signing in...'},fr:{title:'Bon retour !',subtitle:'Veuillez entrer vos informations',usernameLabel:"Nom d'utilisateur",usernamePlaceholder:"Entrez votre nom d'utilisateur",passwordLabel:'Mot de passe',passwordPlaceholder:'••••••••',showPw:'Afficher',hidePw:'Masquer',remember:'Se souvenir 30 jours',forgot:'Mot de passe oublié ?',loginBtn:'Connexion',googleBtn:'Se connecter avec Google',noAccount:"Pas encore de compte ?",signUp:"S'inscrire",bottomPrivacy:'Confidentialité',bottomTerms:"Conditions",bottomContact:'Contact',errorEmpty:"Veuillez saisir vos identifiants",errorGeneric:"Identifiants incorrects. Réessayez.",errorNetwork:'Erreur réseau',loggingIn:'Connexion...'},ru:{title:'С возвращением!',subtitle:'Введите ваши данные',usernameLabel:'Логин',usernamePlaceholder:'Введите логин',passwordLabel:'Пароль',passwordPlaceholder:'••••••••',showPw:'Показать',hidePw:'Скрыть',remember:'Запомнить на 30 дней',forgot:'Забыли пароль?',loginBtn:'Войти',googleBtn:'Войти через Google',noAccount:'Нет аккаунта?',signUp:'Регистрация',bottomPrivacy:'Конфиденциальность',bottomTerms:'Условия',bottomContact:'Контакты',errorEmpty:'Введите логин и пароль',errorGeneric:'Неверный логин или пароль',errorNetwork:'Ошибка сети',loggingIn:'Вход...'},es:{title:'¡Bienvenido!',subtitle:'Ingrese sus datos',usernameLabel:'Usuario',usernamePlaceholder:'Ingrese su usuario',passwordLabel:'Contraseña',passwordPlaceholder:'••••••••',showPw:'Mostrar',hidePw:'Ocultar',remember:'Recordar 30 días',forgot:'¿Olvidó su contraseña?',loginBtn:'Iniciar sesión',googleBtn:'Iniciar con Google',noAccount:'¿No tiene cuenta?',signUp:'Registrarse',bottomPrivacy:'Privacidad',bottomTerms:'Términos',bottomContact:'Contacto',errorEmpty:'Ingrese usuario y contraseña',errorGeneric:'Usuario o contraseña incorrectos',errorNetwork:'Error de red',loggingIn:'Iniciando...'}};
var cur='zh';
var lb=document.querySelectorAll('.lang-btn');
var ti={formTitle:'title',formSubtitle:'subtitle',labelUsername:'usernameLabel',labelPassword:'passwordLabel',rememberText:'remember',forgotLink:'forgot',loginBtnText:'loginBtn',googleBtnText:'googleBtn',noAccountText:'noAccount',signUpLink:'signUp'};
var bl=document.querySelectorAll('#bottomLinks a');
function al(l){
var t=i18n[l];if(!t)return;
Object.keys(ti).forEach(function(k){var e=document.getElementById(k);if(e)e.textContent=t[ti[k]]});
document.getElementById('username').placeholder=t.usernamePlaceholder;
document.getElementById('password').placeholder=t.passwordPlaceholder;
var lnks=[t.bottomPrivacy,t.bottomTerms,t.bottomContact];
bl.forEach(function(e,i){if(lnks[i])e.textContent=lnks[i]});
document.getElementById('eyeToggle').title=sp?t.hidePw:t.showPw;
lb.forEach(function(b){b.classList.toggle('active',b.getAttribute('data-lang')===l)});
cur=l;localStorage.setItem('loginLang',l);
}
lb.forEach(function(b){b.addEventListener('click',function(){al(this.getAttribute('data-lang'))})});
al(localStorage.getItem('loginLang')||'zh');

var ui=document.getElementById('username'),pi=document.getElementById('password');
var et=document.getElementById('eyeToggle'),lbt=document.getElementById('loginBtnText');
var le=document.getElementById('loginError'),lf=document.getElementById('loginForm');
var fc=document.getElementById('formCard');

var sp=false,it=false,ls='idle',pb=false,bb=false,lae=false,pp=false,mx=0,my=0;

var cp=document.getElementById('charPurple'),cb=document.getElementById('charBlack');
var co=document.getElementById('charOrange'),cy=document.getElementById('charYellow');
var pe=document.getElementById('purpleEyes'),be=document.getElementById('blackEyes');
var oe=document.getElementById('orangeEyes'),ye=document.getElementById('yellowEyes');
var ym=document.getElementById('yellowMouth');
var pel=document.getElementById('purpleEyeL'),per=document.getElementById('purpleEyeR');
var bel=document.getElementById('blackEyeL'),ber=document.getElementById('blackEyeR');
var ppl=document.getElementById('purplePL'),ppr=document.getElementById('purplePR');
var bpl=document.getElementById('blackPL'),bpr=document.getElementById('blackPR');
var opl=document.getElementById('orangePL'),opr=document.getElementById('orangePR');
var ypl=document.getElementById('yellowPL'),ypr=document.getElementById('yellowPR');

document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY});

function cpos(el){
var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/3;
var dx=mx-cx,dy=my-cy;
return{faceX:Math.max(-15,Math.min(15,dx/20)),faceY:Math.max(-10,Math.min(10,dy/30)),bodySkew:Math.max(-6,Math.min(6,-dx/120))};
}

function cpl(eyeEl,pupEl,md,flx,fly){
if(flx!==undefined&&fly!==undefined){pupEl.style.transform='translate('+flx+'px,'+fly+'px)';return}
var r=eyeEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
var dx=mx-cx,dy=my-cy,dist=Math.min(Math.sqrt(dx*dx+dy*dy),md||5);
var a=Math.atan2(dy,dx);
pupEl.style.transform='translate('+(Math.cos(a)*dist)+'px,'+(Math.sin(a)*dist)+'px)';
}

function uc(){
var hp=pi.value.length>0,ws=hp&&sp,ht=hp&&!sp;
var p=cpos(cp),b=cpos(cb),o=cpos(co),y=cpos(cy);

/* Purple 身体 */
var ps=p.bodySkew;
if(ws)ps=0;else if(lae)ps=(p.bodySkew||0)-12;else if(it||ht)ps=(p.bodySkew||0)-12;
cp.style.height=(ws?400:(it||ht?440:400))+'px';
cp.style.transform='skewX('+ps+'deg)'+(ws?'':(it||ht?' translateX(40px)':''));

/* Black 身体 */
var bs=b.bodySkew;
if(ws)bs=0;else if(lae)bs=(b.bodySkew||0)*1.5+10;else if(it||ht)bs=(b.bodySkew||0)*1.5;
cb.style.transform='skewX('+bs+'deg)'+(lae?' translateX(20px)':'');

/* Orange / Yellow 身体 */
co.style.transform='skewX('+(ws?0:o.bodySkew)+'deg)';
cy.style.transform='skewX('+(ws?0:y.bodySkew)+'deg)';

/* Purple 眼睛位置 */
if(ws){pe.style.left='20px';pe.style.top='35px'}
else if(lae){pe.style.left='55px';pe.style.top='65px'}
else{pe.style.left=(45+p.faceX)+'px';pe.style.top=(40+p.faceY)+'px'}

/* Black 眼睛位置 */
if(ws){be.style.left='10px';be.style.top='28px'}
else if(lae){be.style.left='32px';be.style.top='12px'}
else{be.style.left=(26+b.faceX)+'px';be.style.top=(32+b.faceY)+'px'}

/* Orange 眼睛位置 */
oe.style.left=(ws?50:82+o.faceX)+'px';
oe.style.top=(ws?85:90+o.faceY)+'px';

/* Yellow 眼睛+嘴位置 */
ye.style.left=(ws?20:52+y.faceX)+'px';
ye.style.top=(ws?35:40+y.faceY)+'px';
ym.style.left=(ws?10:40+y.faceX)+'px';
ym.style.top=(ws?88:88+y.faceY)+'px';

/* 瞳孔方向 */
var pfx,pfy,bfx,bfy,ofx,ofy,yfx,yfy;
if(ws){
pfx=pp?4:-4;pfy=pp?5:-4;bfx=-4;bfy=-4;ofx=-5;ofy=-4;yfx=-5;yfy=-4;
}else if(lae){
pfx=3;pfy=4;bfx=0;bfy=-4;ofx=undefined;ofy=undefined;yfx=undefined;yfy=undefined;
}else{pfx=undefined;pfy=undefined;bfx=undefined;bfy=undefined;ofx=undefined;ofy=undefined;yfx=undefined;yfy=undefined}

cpl(pel,ppl,5,pfx,pfy);cpl(per,ppr,5,pfx,pfy);
cpl(bel,bpl,4,bfx,bfy);cpl(ber,bpr,4,bfx,bfy);
cpl(document.getElementById('orangeEyeL'),opl,5,ofx,ofy);
cpl(document.getElementById('orangeEyeR'),opr,5,ofx,ofy);
cpl(document.getElementById('yellowEyeL'),ypl,5,yfx,yfy);
cpl(document.getElementById('yellowEyeR'),ypr,5,yfx,yfy);
}

/* 眨眼 */
function bloop(sn,el,er){
